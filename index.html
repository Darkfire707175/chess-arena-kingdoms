<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chess Arena — Kingdoms</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="startScreen" role="dialog" aria-label="Pantalla de inicio">
  <div class="startPanel">
    <div class="startCrown">♛</div>
    <h1 class="startTitle">CHESS ARENA</h1>
    <p class="startSubtitle">Kingdoms · Forja tu reino</p>
    <button class="startButton" id="playButton" type="button">⚔ JUGAR</button>
    <button class="startButton" id="googleButton" type="button"><span class="googleG">G</span>Conectar con Google</button>
    <p id="googleStatus" aria-live="polite">Puedes jugar sin conectar una cuenta.</p>
    <p class="startFoot">EXPLORA · RECLUTA · CONQUISTA</p>
  </div>
</div>


<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">👑 Nivel: <b id="level">1</b></div>
  <div class="stat">⭐ XP: <b id="xp">0</b></div>
  <div class="stat">🪙 <b id="coins">100</b></div>
  <div class="stat">❤️ <b id="lives">3</b></div>
  <div class="stat">⚔️ <b id="score">0</b></div>
</div>

<div id="ranking">
  <h3>⚔️ REINOS</h3>
  <div id="rankingList"></div>
</div>

<div id="pieces"></div>

<canvas id="minimap" width="420" height="324"></canvas>

<div id="message"></div>

<div id="gameOver">
  <div class="gameOverBox">
    <h1>Tu reino ha caído</h1>
    <p id="gameOverText"></p>
    <button onclick="location.reload()">Volver a jugar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="js/01-save.js"></script>
<script defer src="js/02-config-state.js"></script>
<script defer src="js/03-map.js"></script>
<script defer src="js/04-map-render.js"></script>
<script defer src="js/05-chests.js"></script>
<script defer src="js/06-pieces.js"></script>
<script defer src="js/07-units.js"></script>
<script defer src="js/08-combat.js"></script>
<script defer src="js/09-game-loop.js"></script>
<script defer src="js/10-ui.js"></script>
<script defer src="js/11-input.js"></script>
<script defer src="js/12-main.js"></script>
</body>
</html>
